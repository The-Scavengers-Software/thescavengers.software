<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Scavenger's Software LLC</title>
  <meta name="description" content="An independent software studio crafting mobile apps, developer tools, games, and the occasional experiment worth shipping.">
  <meta property="og:title" content="The Scavenger's Software LLC">
  <meta property="og:description" content="An independent software studio crafting mobile apps, developer tools, games, and the occasional experiment worth shipping.">
  <meta property="og:url" content="https://thescavengers.software">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%85%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #12100e;
      --border: #2e2a24;
      --text: #ece7df;
      --text-muted: #a39b8d;
      --accent: #e8a33d;
      color-scheme: dark;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #faf7f2;
        --border: #e5ded2;
        --text: #26221c;
        --text-muted: #6f6759;
        --accent: #b3731a;
        color-scheme: light;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 1.5rem;
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      max-width: 16ch;
    }
    main p {
      margin-top: 1.5rem;
      max-width: 52ch;
      color: var(--text-muted);
      font-size: clamp(1.05rem, 2vw, 1.25rem);
    }
    .actions {
      margin-top: 2.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
    }
    .actions a {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.75rem 1.6rem;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
    }
    .actions svg { flex: none; }
    .actions .primary {
      background: var(--accent);
      color: var(--bg);
    }
    .actions .primary:hover { filter: brightness(1.1); }
    .actions .secondary {
      border: 1px solid var(--border);
      color: var(--text);
    }
    .actions .secondary:hover { border-color: var(--accent); color: var(--accent); }
    footer {
      padding: 1.5rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    footer a { color: var(--text-muted); }
    footer a:hover { color: var(--accent); }
  </style>
</head>
<body>

<main>
  <h1>The Scavenger's Software LLC</h1>
  <p>An independent software studio crafting mobile apps, developer tools, games, and the occasional experiment worth shipping.</p>
  <div class="actions">
    <a class="primary" href="mailto:drew@thescavengers.software">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="4" width="20" height="16" rx="2"/>
        <path d="m2 7 10 6L22 7"/>
      </svg>
      Get in touch
    </a>
    <a class="secondary" href="https://github.com/r0adkll">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
      </svg>
      GitHub
    </a>
  </div>
</main>

<footer>
  © 2026 The Scavenger's Software LLC · <a href="/privacy/">Privacy</a>
</footer>

</body>
</html>
